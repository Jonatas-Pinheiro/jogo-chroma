<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17110d">
  <title>CHROMA — versões</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17110d; color: #fff3dc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); }
    .eyebrow { color: #ffb81c; font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2.5rem, 10vw, 5rem); line-height: 1; }
    p { color: #c7b69f; line-height: 1.6; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 32px; }
    a { display: block; padding: 22px; border: 1px solid #59432d; border-radius: 16px; color: inherit; text-decoration: none; background: #2c2119; transition: transform .15s ease, border-color .15s ease; }
    a:hover, a:focus-visible { transform: translateY(-3px); border-color: #ffb81c; outline: none; }
    a strong { display: block; margin-bottom: 8px; color: #ffcf67; font-size: 1.2rem; }
    a span { color: #c7b69f; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Jogo CHROMA</div>
    <h1>Versões</h1>
    <p>Escolha qual versão deseja abrir.</p>
    <nav aria-label="Versões do jogo">
      <a href="./Legacy/"><strong>Legacy</strong><span>Versão que estava publicada anteriormente.</span></a>
      <a href="./Rework/CHROMA-REWORK-V12-1/CHROMA-REWORK-V11-CHAOS-METER/"><strong>Rework</strong><span>Nova estrutura CHROMA-REWORK-V12-1.</span></a>
    </nav>
  </main>
</body>
</html>
